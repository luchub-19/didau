[tool.poetry]
name = "didau-backend"
version = "0.1.0"
description = "Backend service cho hệ thống Đi Đâu"
authors = ["Đi Đâu Team <dev@didau.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11, <3.15"
fastapi = ">=0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28.0"}
pydantic = ">=2.6.0"
pydantic-settings = ">=2.2.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.28"}
asyncpg = ">=0.29.0"
alembic = ">=1.13.1"
python-dateutil = ">=2.9.0"
pytz = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app", "tests"]
python_files = ["test_*.py", "*_test.py", "main.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
