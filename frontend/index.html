<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Hangoutplanner — Ứng dụng chốt kèo đi chơi, tìm quán và lên lịch trình cùng bạn bè" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('didau.theme');
          var theme = (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <title>Hangoutplanner</title>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
