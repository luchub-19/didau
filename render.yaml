services:
  - type: web
    name: didau-backend
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: PLACES_PROVIDER
        value: osm
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: GOOGLE_MATCH_DAILY_LIMIT
        value: "1000"
