<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile — Khám phá</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#1C1917;background:#FAFAF9}
a{color:#C73E26}a:hover{color:#9F2F1C}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1C1917;flex-shrink:0;box-sizing:border-box}
.av.sm{width:20px;height:20px;font-size:9px}
.stack{display:flex}
.stack .av{margin-left:-7px;border:2px solid #fff}
.stack .av:first-child{margin-left:0}
.ph{background-color:#E7E5E4;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.map{position:absolute;left:0;right:0;top:0;bottom:0;background-color:#EEF0EA;background-image:repeating-linear-gradient(28deg,transparent 0 46px,#fff 46px 50px),repeating-linear-gradient(118deg,transparent 0 70px,#fff 70px 75px)}
.pin{position:absolute;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;background:#FF6B4A;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.card{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #E7E5E4;border-radius:16px;background:#fff}
.card.lead{border-color:#FF6B4A;box-shadow:0 0 0 3px #FFF1EC}
.name{font-size:16px;font-weight:700}
.meta{font-size:14px;color:#57534E}
.heart{display:flex;flex-direction:column;align-items:center;border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:#57534E;min-width:44px;min-height:44px;justify-content:center}
.heart.on{color:#C73E26}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:#78716C}
.tab.on{color:#C73E26}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAFAF9">
  <div class="map">
    <div style="position: absolute; right: -60px; top: -40px; width: 140px; height: 900px; background: #CFE3EE; transform: rotate(16deg)"></div>
    <span class="pin" style="left: 30%; top: 22%"></span>
    <span class="pin" style="left: 52%; top: 30%; background: #1C1917"></span>
    <span class="pin" style="left: 64%; top: 18%"></span>
    <span class="pin" style="left: 20%; top: 38%; background: #D6D3D1"></span>
  </div>

  <header style="position: absolute; left: 12px; right: 12px; top: 12px; height: 56px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.1); display: flex; align-items: center; gap: 6px; padding: 0 8px 0 4px">
    <button aria-label="Về trang chủ" style="width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tối thứ Sáu Q1</div>
      <div style="font-size: 12px; color: #C73E26; font-weight: 600">Bước 2/4 · Bình chọn</div>
    </div>
    <button aria-label="4 người đang xem" style="display: flex; align-items: center; gap: 4px; border: 0; background: #F5F5F4; border-radius: 999px; padding: 4px 10px 4px 4px; font: inherit; font-size: 13px; font-weight: 700">
      <span class="stack"><span class="av sm" style="background: #FDE68A">M</span><span class="av sm" style="background: #BAE6FD">A</span></span>4
    </button>
    <button aria-label="Khánh, chủ phòng" style="border: 0; background: transparent; padding: 0"><span class="av" style="width: 36px; height: 36px; background: #FECACA; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #047857">K</span></button>
  </header>

  <section aria-label="Danh sách nhóm" style="position: absolute; left: 0; right: 0; top: 360px; bottom: 64px; background: #fff; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.1); padding: 8px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #D6D3D1; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-size: 18px; font-weight: 700">Danh sách nhóm · 5</h2>
      <span style="font-size: 13px; color: #57534E; font-weight: 600">3/4 đã chọn</span>
    </div>
    <div style="background: #1C1917; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; font-size: 14px"><b>Hoà 3–3</b> <span style="opacity: .8">· Pizza 4P's và Cà Phê Bệt</span></div>
      <button style="height: 40px; border: 0; border-radius: 10px; background: #FF6B4A; color: #2B1B12; font: inherit; font-size: 14px; font-weight: 700; padding: 0 12px">Trọng tài</button>
    </div>
    <article class="card lead">
      <div class="ph" style="width: 72px; height: 72px; border-radius: 12px; background-color: #F3D9C9; flex-shrink: 0"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="name">Pizza 4P's Lê Thánh Tôn</span>
        <span class="meta">~250k · 600 m</span>
        <span class="stack"><span class="av sm" style="background: #FECACA">K</span><span class="av sm" style="background: #FDE68A">M</span><span class="av sm" style="background: #BAE6FD">A</span></span>
      </div>
      <button class="heart on" aria-label="Bỏ thích"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>3</button>
    </article>
    <article class="card lead">
      <div class="ph" style="width: 72px; height: 72px; border-radius: 12px; background-color: #F0E1C4; flex-shrink: 0"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span class="name">Cà Phê Bệt Nhà Thờ</span>
        <span class="meta">~45k · 450 m</span>
        <span class="stack"><span class="av sm" style="background: #FDE68A">M</span><span class="av sm" style="background: #BAE6FD">A</span><span class="av sm" style="background: #DDD6FE">T</span></span>
      </div>
      <button class="heart" aria-label="Thích"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>3</button>
    </article>
  </section>

  <button aria-label="Thêm quán" style="position: absolute; right: 16px; top: 296px; height: 48px; border: 0; border-radius: 999px; background: #FF6B4A; color: #2B1B12; font: inherit; font-size: 15px; font-weight: 700; padding: 0 18px; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 16px rgba(0,0,0,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Thêm quán</button>

  <nav aria-label="Điều hướng" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid #E7E5E4; display: flex">
    <button class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Khám phá</button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Kế hoạch</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

return {};
}
}
</script>
</body>
</html>
