<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mobile — Chi tiết quán</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#1C1917;background:#FAFAF9}
a{color:#C73E26}a:hover{color:#9F2F1C}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#1C1917;flex-shrink:0;box-sizing:border-box}
.av.sm{width:22px;height:22px;font-size:10px}
.stack{display:flex}
.stack .av{margin-left:-7px;border:2px solid #fff}
.stack .av:first-child{margin-left:0}
.ph{background-color:#E7E5E4;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.sec-h{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#78716C;margin:0}
.rev{border:1px solid #E7E5E4;border-radius:14px;padding:12px;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
.btn{height:52px;border-radius:14px;border:0;font:inherit;font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cbtn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #fff; display: flex; flex-direction: column">
  <div style="position: relative; height: 280px; flex-shrink: 0">
    <div class="ph" style="position: absolute; inset: 0; background-color: #F0E1C4"></div>
    <span style="position: absolute; left: 16px; bottom: 16px; font-size: 11px; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 6px; color: #57534E">ảnh quán · vuốt ngang</span>
    <div style="position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 6px">
      <span style="width: 18px; height: 6px; border-radius: 3px; background: #fff"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6)"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6)"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6)"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.6)"></span>
    </div>
    <button class="cbtn" aria-label="Quay lại" style="position: absolute; left: 14px; top: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <span style="position: absolute; right: 14px; top: 20px; font-size: 13px; font-weight: 700; background: rgba(28,25,23,.7); color: #fff; padding: 4px 10px; border-radius: 999px">1/8</span>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 18px 18px 0; display: flex; flex-direction: column; gap: 16px">
    <div>
      <span style="font-size: 12px; font-weight: 700; color: #C73E26; background: #FFF1EC; padding: 2px 8px; border-radius: 999px">Đang dẫn</span>
      <h1 style="margin: 8px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Cà Phê Bệt Nhà Thờ</h1>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 15px; color: #57534E"><span>Cà phê</span><span>~45k</span><span>450 m</span><span><b style="color: #1C1917">4.6</b> · 1,2k</span></div>
      <div style="margin-top: 4px; font-size: 15px"><b style="color: #047857">Đang mở</b> <span style="color: #57534E">· tới 23:00</span></div>
    </div>

    <div style="background: #FFF1EC; border-radius: 14px; padding: 12px; display: flex; gap: 10px">
      <span class="av" style="background: #FDE68A">M</span>
      <div style="font-size: 15px; line-height: 1.5"><b>Minh:</b> “Ngồi bệt ngắm nhà thờ buổi tối, rẻ mà vui.”</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 class="sec-h">Giới thiệu</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.6">[2–3 câu giới thiệu.] Nên thử: cà phê sữa đá, bạc xỉu.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="sec-h">Bạn bè nói</h2>
      <div class="rev"><b>Thảo</b><span>Đông vào cuối tuần, nên tới trước 19h.</span></div>
    </div>
  </div>

  <div style="border-top: 1px solid #E7E5E4; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px; background: #fff">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #57534E">
      <span class="stack"><span class="av sm" style="background: #FDE68A">M</span><span class="av sm" style="background: #BAE6FD">A</span><span class="av sm" style="background: #DDD6FE">T</span></span>3 người muốn đi
    </div>
    <div style="display: flex; gap: 10px">
      <button class="btn" style="flex: 0 0 120px; background: #fff; border: 1.5px solid #D6D3D1; color: #1C1917"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Không</button>
      <button class="btn" style="flex: 1; background: #FF6B4A; color: #2B1B12"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Muốn đi</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
