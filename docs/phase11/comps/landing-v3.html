<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangoutplanner về đêm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Bố cục: phố đêm vẽ tay ôm đáy hero, cửa sổ app + bản đồ THẬT (luôn sáng) là vật sáng nhất; dàn 4 nhân vật xuyên suốt.
   Chuyển động: mở màn "bốn bạn hội tụ" một lần; còn lại chỉ phản hồi thao tác. */
:root {
  color-scheme: dark;
  --night: #16111C; --night-2: #201926; --night-3: #2B2233; --night-line: #3D3247;
  --moon: #F4ECE2; --moon-2: #C2B4C4; --moon-3: #9A8C9E;
  --lamp: #F2B544; --lamp-ink: #2A1A0C; --lamp-ink-2: #5A3B17;
  --coral: #FF6B4A; --coral-hover: #F25C3C; --coral-on-dark: #FF8566;
  --paper: #FAFAF9; --paper-2: #F5F5F4; --paper-line: #E7E5E4;
  --ink: #1C1917; --ink-2: #57534E; --ink-3: #78716C;
  --accent-soft: #FFF1EC; --accent-text: #C73E26; --success: #047857; --cat-food: #C2410C;
  --house-1: #241B2E; --house-2: #2C2238; --house-3: #1E1726;
  --display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-press: 120ms; --t-ui: 220ms; --t-sheet: 360ms; --t-moment: 600ms;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--moon); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; scrollbar-color: var(--night-line) var(--night); }
::selection { background: var(--lamp); color: var(--lamp-ink); }
a { color: inherit; text-underline-offset: 4px; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--coral-on-dark); outline-offset: 3px; border-radius: 8px; }
.app :focus-visible, .board :focus-visible { outline-color: var(--accent-text); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h2 { scroll-margin-top: 96px; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.av-img { border-radius: 50%; display: block; background: #fff; }

/* ---------- Nút ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 26px; border-radius: 9999px; border: 0; font: 600 16px/1.2 var(--body); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color 160ms var(--ease-out), transform var(--t-press) var(--ease-out), border-color 160ms var(--ease-out); }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--coral); color: var(--night); }
.btn-ghost { background: transparent; color: var(--moon); border: 1px solid var(--night-line); }
.btn-sm { min-height: 44px; padding: 10px 18px; font-size: 14px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 9999px; border: 1px solid var(--night-line); background: var(--night-2); color: var(--moon-2); cursor: pointer; transition: color var(--t-ui) var(--ease-out), background-color var(--t-ui) var(--ease-out); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-pressed="true"] { color: var(--lamp); }
@media (hover: hover) { .btn-primary:hover { background: var(--coral-hover); } .btn-ghost:hover, .icon-btn:hover { border-color: var(--moon-3); background: var(--night-3); } }

/* ---------- Thanh đỉnh ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-bottom: 1px solid transparent; transition: background-color var(--t-sheet) var(--ease-out), border-color var(--t-sheet) var(--ease-out); }
.top.scrolled { background: rgb(22 17 28 / 0.94); border-bottom-color: var(--night-line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.wordmark { display: inline-flex; flex-direction: column; line-height: 1; text-decoration: none; }
.wordmark b { font: 800 26px/1 var(--display); letter-spacing: -0.025em; color: var(--moon); }
.wordmark i { font: 700 8.7px/1 var(--body); font-style: normal; letter-spacing: 0.42em; color: var(--coral-on-dark); margin-top: 5px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.top-create { opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity var(--t-ui) var(--ease-out), transform var(--t-ui) var(--ease-out), background-color 160ms var(--ease-out); }
.top.show-cta .top-create { opacity: 1; transform: none; pointer-events: auto; }
.lang { display: inline-flex; padding: 4px; border-radius: 9999px; background: var(--night-2); border: 1px solid var(--night-line); position: relative; }
.lang button { position: relative; z-index: 1; min-height: 34px; width: 42px; border: 0; border-radius: 9999px; background: transparent; color: var(--moon-2); font: 600 13px/1 var(--body); cursor: pointer; transition: color var(--t-ui) var(--ease-out); }
.lang button[aria-pressed="true"] { color: var(--moon); }
.lang .knob { position: absolute; top: 4px; left: 4px; width: 42px; height: 34px; border-radius: 9999px; background: var(--night-3); transition: transform var(--t-ui) var(--ease-out); }
.lang[data-lang="en"] .knob { transform: translateX(42px); }

/* ---------- Hero + phố đêm ---------- */
.hero { position: relative; overflow: hidden; isolation: isolate; margin-top: -73px; padding-top: 112px; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(55% 45% at 72% 40%, rgb(242 181 68 / 0.16), rgb(242 181 68 / 0) 70%), radial-gradient(40% 30% at 50% 100%, rgb(255 107 74 / 0.12), rgb(255 107 74 / 0) 70%); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 13fr); gap: 48px; align-items: start; position: relative; z-index: 2; }
.hero h1 { font: 800 clamp(40px, 4.6vw, 64px)/1.2 var(--display); letter-spacing: -0.025em; color: var(--moon); }
.hero h1 .ln { display: block; }
.hero h1 .hl { color: var(--lamp); }
.hero .lede { margin-top: 24px; font-size: 19px; line-height: 1.6; color: var(--moon-2); max-width: 30em; }
.hero .lede strong { color: var(--moon); font-weight: 600; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
.resume { margin-top: 18px; font-size: 14px; color: var(--moon-3); }
.resume a { color: var(--moon-2); }
.try { margin-top: 24px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--moon-3); }
.try svg { width: 18px; height: 18px; color: var(--lamp); flex: none; }
.intro .ln, .intro .lede, .intro .cta-row, .intro .resume, .intro .try { animation: rise 760ms var(--ease-out) both; }
.intro .ln + .ln { animation-delay: 90ms; }
.intro .lede { animation-delay: 200ms; } .intro .cta-row { animation-delay: 280ms; } .intro .resume { animation-delay: 340ms; } .intro .try { animation-delay: 2300ms; }
.intro .app { animation: lampOn 1100ms 300ms var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes lampOn { from { opacity: 0.3; filter: brightness(0.45) saturate(0.6); } to { opacity: 1; filter: none; } }

/* Phố đêm: dãy nhà ống, bảng hiệu, đèn đường, lòng đường; xe chạy trên lòng đường */
.street { position: relative; height: 230px; margin-top: -64px; z-index: 1; pointer-events: none; }
.street svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.street .glow { opacity: 0; transition: opacity 500ms var(--ease-out); }
.street.lit .glow { opacity: 1; }
.street .win { opacity: 0.15; transition: opacity 600ms var(--ease-out); }
.street.lit .win.on { opacity: 1; }
.riders { position: absolute; left: 0; right: 0; bottom: 30px; height: 96px; }
.rider { position: absolute; bottom: 0; width: 92px; height: 92px; will-change: transform; }
.rider svg { position: absolute; left: 0; bottom: 0; width: 92px; height: 56px; overflow: visible; }
.rider img { position: absolute; left: 30px; bottom: 44px; width: 38px; height: 38px; box-shadow: 0 0 0 2px var(--night); }
.rider.rev svg { transform: scaleX(-1); }
.rider.rev img { left: 24px; }
.rider .tag { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%); font: 600 11.5px/1 var(--body); color: var(--moon); background: rgb(22 17 28 / 0.85); border: 1px solid var(--night-line); border-radius: 9999px; padding: 5px 9px; white-space: nowrap; opacity: 0; transition: opacity 400ms var(--ease-out); }
.riders.arrived .tag { opacity: 1; }
.riders.arrived .rider:nth-child(2) .tag { transition-delay: 80ms; } .riders.arrived .rider:nth-child(3) .tag { transition-delay: 160ms; } .riders.arrived .rider:nth-child(4) .tag { transition-delay: 240ms; }

/* ---------- Cửa sổ app (luôn sáng) ---------- */
.app { background: var(--paper); color: var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 0 40px 80px -24px rgb(0 0 0 / 0.65), 0 12px 24px -12px rgb(0 0 0 / 0.5); font-size: 13px; line-height: 1.45; position: relative; }
.app-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--paper-line); background: var(--paper); min-height: 50px; }
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 800 14px/1 var(--display); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; right: 4px; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: #FF8566; }
.app-title { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.code { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-2); background: var(--paper-2); border-radius: 9999px; padding: 3px 9px; }
.steps { margin-left: auto; display: flex; gap: 2px; flex: none; }
.step-pill { font: 600 11.5px/1 var(--body); padding: 7px 10px; border-radius: 9999px; color: var(--ink-3); white-space: nowrap; border: 0; background: transparent; transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out); }
button.step-pill { cursor: pointer; min-height: 30px; }
.step-pill.done { color: var(--success); }
.step-pill.now { background: var(--accent-soft); color: var(--accent-text); }
@media (hover: hover) { button.step-pill:not(.now):hover { background: var(--paper-2); color: var(--ink); } }
.presence { display: flex; align-items: center; margin-left: auto; padding-left: 6px; }
.presence img { width: 26px; height: 26px; border: 2px solid var(--paper); margin-left: -7px; }
.presence .on { position: relative; }
.app-body { display: grid; grid-template-columns: 262px minmax(0, 1fr); min-height: 440px; }
.panel { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid var(--paper-line); background: var(--paper); }
.card { border: 1px solid var(--paper-line); border-radius: 14px; padding: 12px; background: #fff; }
.card-head { font-weight: 700; font-size: 13.5px; }
.card-sub { color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
.sugg { margin-top: 10px; background: var(--paper-2); border-radius: 12px; padding: 10px; }
.sugg-title { font-weight: 700; font-size: 13px; }
.sugg-meta { color: var(--ink-2); font-size: 12px; }
.chot { margin-top: 9px; width: 100%; min-height: 40px; border: 0; border-radius: 9999px; background: var(--coral); color: var(--ink); font: 600 13px/1 var(--body); display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: background-color 160ms var(--ease-out), transform var(--t-press) var(--ease-out); }
.chot:active { transform: scale(0.97); }
@media (hover: hover) { .chot:hover { background: var(--coral-hover); } }
.linkbtn { display: flex; align-items: center; justify-content: center; gap: 4px; width: 100%; margin-top: 4px; min-height: 34px; border: 0; background: transparent; color: var(--accent-text); font: 600 12px/1 var(--body); cursor: pointer; border-radius: 9999px; }
.linkbtn svg { width: 12px; height: 12px; transition: transform var(--t-ui) var(--ease-out); }
.linkbtn[aria-expanded="true"] svg { transform: rotate(180deg); }
.why-box { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-sheet) var(--ease-out); }
.why-box.open { grid-template-rows: 1fr; }
.why-box > div { overflow: hidden; min-height: 0; }
.why-in { padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
.why-rule { font-size: 11.5px; color: var(--ink-2); }
.mini { display: grid; grid-template-columns: 5.6em minmax(0, 1fr) 2.4em; gap: 6px; align-items: center; font-size: 11px; }
.mini .t { height: 8px; border-radius: 9999px; background: #fff; overflow: hidden; }
.mini .t i { display: block; height: 100%; border-radius: inherit; background: #A8A29E; transform-origin: left; transform: scaleX(0); transition: transform 700ms var(--ease-out); }
.why-box.open .mini .t i { transform: none; transition-delay: 120ms; }
.mini.best .t i { background: var(--coral); }
.mini .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
#room-places { display: flex; flex-direction: column; gap: 8px; }
.place { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 9px; align-items: center; border: 1px solid var(--paper-line); border-radius: 12px; padding: 7px 8px; background: #fff; transition: border-color var(--t-ui) var(--ease-out), opacity var(--t-ui) var(--ease-out); }
.place.hot { border-color: rgb(199 62 38 / 0.45); }
.place.faded { opacity: 0.45; }
.place-ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: #FFF1E8; color: var(--cat-food); }
.place-ico svg { width: 18px; height: 18px; }
.place-name { display: block; font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.place-meta { font-size: 11px; color: var(--ink-3); }
.heart { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 44px; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-3); font: 600 11px/1 var(--body); cursor: pointer; transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out); }
.heart svg { width: 17px; height: 17px; }
.heart .on { display: none; }
.heart[aria-pressed="true"] { color: var(--accent-text); background: var(--accent-soft); }
.heart[aria-pressed="true"] .on { display: block; }
.heart[aria-pressed="true"] .off { display: none; }
.heart:disabled { cursor: default; }
.heart.pop svg { animation: heartPop 360ms var(--ease-out); }
@keyframes heartPop { 0% { transform: scale(0.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
@media (hover: hover) { .heart:not(:disabled):hover { background: var(--paper-2); color: var(--ink); } .heart[aria-pressed="true"]:hover { background: var(--accent-soft); color: var(--accent-text); } }
.tag { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: 9999px; padding: 1px 7px; }
.locked { text-align: center; background: var(--accent-soft); border-color: rgb(199 62 38 / 0.2); padding: 18px 12px 10px; }
.stamp { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; background: var(--coral); color: var(--ink); display: grid; place-items: center; animation: stamp 620ms var(--ease-out) both; }
.stamp svg { width: 22px; height: 22px; }
@keyframes stamp { 0% { opacity: 0; transform: scale(1.6) rotate(-12deg); } 55% { opacity: 1; transform: scale(0.94) rotate(0); } 100% { transform: none; } }
.locked .badge { margin-top: 10px; font-weight: 700; color: var(--accent-text); font-size: 12.5px; animation: rise 500ms 180ms var(--ease-out) both; }
.locked .nm { margin-top: 2px; font: 800 19px/1.25 var(--display); letter-spacing: -0.01em; animation: rise 500ms 240ms var(--ease-out) both; }
.locked .mt { margin-top: 4px; font-size: 11.5px; color: var(--ink-2); animation: rise 500ms 300ms var(--ease-out) both; }
.locked .linkbtn { animation: rise 500ms 380ms var(--ease-out) both; }
.swap { animation: swapIn var(--t-sheet) var(--ease-out); }
@keyframes swapIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.map { position: relative; background: #F3EFE6; min-height: 100%; overflow: hidden; }
.map .ml { position: absolute; inset: 0; }
.map-chip { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: var(--ink); color: var(--paper); border-radius: 9999px; padding: 7px 12px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.toast { position: absolute; right: 12px; top: 12px; z-index: 3; background: #fff; color: var(--ink); border-radius: 12px; padding: 7px 10px; font-size: 12px; font-weight: 500; box-shadow: 0 10px 24px -10px rgb(28 25 23 / 0.45); display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(-6px); transition: opacity var(--t-ui) var(--ease-out), transform var(--t-ui) var(--ease-out); pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast img { width: 22px; height: 22px; display: block; }

/* Ghim quán trên bản đồ thật (marker HTML) */
.rpin { display: flex; align-items: center; gap: 5px; padding: 4px 9px 4px 4px; border-radius: 9999px; background: #fff; color: var(--ink); font: 700 11.5px/1 var(--body); box-shadow: 0 4px 12px -4px rgb(28 25 23 / 0.45); border: 2px solid #fff; white-space: nowrap; transition: background-color var(--t-ui) var(--ease-out), transform var(--t-ui) var(--ease-out), opacity var(--t-ui) var(--ease-out); cursor: default; }
.rpin .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--coral); color: var(--ink); font-size: 10.5px; }
.rpin .dot svg { width: 12px; height: 12px; }
.rpin.sel { background: var(--coral); }
.rpin.sel .dot { background: #fff; color: var(--accent-text); }
.rpin.hot { transform: scale(1.1); }
.rpin.faded { opacity: 0.4; }
.rpin.done .dot { background: var(--success); color: #fff; }
.rpin.bump { animation: heartPop 380ms var(--ease-out); }

/* ---------- Mục chung ---------- */
section { position: relative; }
.sec { padding-block: 128px; }
.sec-head { max-width: 40rem; }
.sec h2 { font: 800 clamp(34px, 4.6vw, 60px)/1.2 var(--display); letter-spacing: -0.025em; }
.sec .sub { margin-top: 18px; font-size: 18px; color: var(--moon-2); max-width: 34em; }

/* ---------- 1. Nhóm chat ---------- */
.chat-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 64px; align-items: center; }
.chat { background: var(--night-2); border: 1px solid var(--night-line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 10px; max-width: 30rem; justify-self: end; width: 100%; }
.chat-day { align-self: center; font-size: 12px; font-weight: 600; color: var(--moon-3); padding: 6px 0; }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: end; }
.msg .av-img { width: 32px; height: 32px; }
.msg .bub { background: var(--night-3); border-radius: 16px 16px 16px 4px; padding: 9px 13px; max-width: 22rem; justify-self: start; }
.msg .who { font-size: 12px; font-weight: 600; color: var(--moon-3); }
.msg .txt { font-size: 15px; color: var(--moon); }
.msg.dim .bub, .msg.dim .av-img { opacity: 0.55; }
.unread { align-self: center; margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--lamp); background: rgb(242 181 68 / 0.1); border-radius: 9999px; padding: 6px 14px; }
.typing { display: inline-flex; gap: 4px; padding: 13px 14px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--moon-3); animation: blink 900ms ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: 150ms; } .typing i:nth-child(3) { animation-delay: 300ms; }
@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.chat .seq { transition: opacity 420ms var(--ease-out), transform 420ms var(--ease-out); }
.chat.pre .seq { opacity: 0; transform: translateY(10px); }
.chat .typing-row { display: none; }
.chat .typing-row.on { display: grid; }

/* ---------- Dải ảnh thật ---------- */
.photo { position: relative; height: min(72vh, 640px); min-height: 380px; overflow: hidden; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; transform: scale(1.06); transition: transform 1600ms var(--ease-out); }
.photo.in img { transform: none; }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, var(--night) 0%, rgb(22 17 28 / 0.25) 22%, rgb(22 17 28 / 0.25) 55%, var(--night) 100%); }
.photo .cap { position: absolute; z-index: 1; left: 0; right: 0; bottom: 56px; }
.photo .cap p { font: 800 clamp(28px, 4vw, 52px)/1.2 var(--display); letter-spacing: -0.02em; max-width: 16em; text-shadow: 0 2px 24px rgb(0 0 0 / 0.6); }
.photo .credit { position: absolute; z-index: 1; right: var(--gutter-r); bottom: 14px; font-size: 11.5px; color: var(--moon-2); text-shadow: 0 1px 8px rgb(0 0 0 / 0.8); }

/* ---------- 2. Bốn bước ---------- */
.flow { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 64px; margin-top: 72px; }
.flow-steps { display: flex; flex-direction: column; }
.fstep { min-height: 56vh; display: flex; flex-direction: column; justify-content: center; padding-block: 24px; }
.fstep:first-child { min-height: 44vh; justify-content: flex-start; }
.fstep-n { font: 800 18px/1 var(--display); color: var(--moon-3); display: flex; align-items: center; gap: 12px; transition: color var(--t-ui) var(--ease-out); }
.fstep-n::after { content: ""; height: 1px; width: 48px; background: var(--night-line); transform-origin: left; transition: transform var(--t-sheet) var(--ease-out), background-color var(--t-ui) var(--ease-out); }
.fstep h3 { margin-top: 14px; font: 800 clamp(28px, 3.2vw, 40px)/1.2 var(--display); letter-spacing: -0.02em; color: var(--moon-3); transition: color var(--t-ui) var(--ease-out); }
.fstep p { margin-top: 12px; font-size: 17px; color: var(--moon-3); max-width: 26em; transition: color var(--t-ui) var(--ease-out); }
.fstep.on .fstep-n { color: var(--lamp); }
.fstep.on .fstep-n::after { transform: scaleX(2); background: var(--lamp); }
.fstep.on h3 { color: var(--moon); }
.fstep.on p { color: var(--moon-2); }
.fstep .inline { display: none; }
.flow-device { position: sticky; top: 14vh; align-self: start; }
.flow-device .app { min-height: 460px; }
.screen { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.screen.fwd { animation: screenFwd var(--t-sheet) var(--ease-out); }
.screen.back { animation: screenBack var(--t-sheet) var(--ease-out); }
@keyframes screenFwd { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes screenBack { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
.screen .st { animation: rise 460ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }
.search { border: 1px solid var(--paper-line); border-radius: 12px; padding: 10px 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; background: #fff; min-height: 42px; }
.search b { color: var(--ink); font-weight: 500; }
.caret { display: inline-block; width: 1.5px; height: 15px; background: var(--accent-text); margin-left: -6px; }
.by { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); }
.by img { width: 22px; height: 22px; }
.voterow { display: flex; gap: 6px; }
.vbtn { flex: 1; min-height: 36px; border-radius: 9999px; border: 1px solid var(--paper-line); background: #fff; font: 600 12px/1 var(--body); color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.vbtn.yes { background: var(--accent-soft); color: var(--accent-text); border-color: rgb(199 62 38 / 0.25); }
.voters { display: flex; }
.voters img { width: 20px; height: 20px; margin-left: -5px; border: 2px solid #fff; animation: popIn 380ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 110ms + 400ms); }
@keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }
.lead { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.lead .bar { flex: 1; height: 6px; border-radius: 9999px; background: var(--paper-2); overflow: hidden; }
.lead .bar i { display: block; height: 100%; background: var(--coral); border-radius: inherit; transform-origin: left; animation: grow 900ms 400ms var(--ease-out) both; }
@keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
.done-card { border-radius: 16px; padding: 22px; background: var(--accent-soft); text-align: center; }
.done-card .stamp { width: 48px; height: 48px; }
.done-card .nm { margin-top: 10px; font: 800 26px/1.2 var(--display); letter-spacing: -0.02em; color: var(--ink); }
.done-card .mt { margin-top: 6px; color: var(--ink-2); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.done-card .mt img { width: 22px; height: 22px; }
.cal { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 10px; }
.cal .h { font-size: 11px; color: var(--ink-3); height: 44px; font-variant-numeric: tabular-nums; }
.cal .lane { position: relative; grid-row: 1 / span 7; grid-column: 2; background: repeating-linear-gradient(to bottom, var(--paper-line) 0 1px, transparent 1px 44px); }
.ev { position: absolute; left: 0; right: 0; border-radius: 10px; padding: 7px 10px; font-size: 12px; animation: slideIn 520ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 110ms + 160ms); }
@keyframes slideIn { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
.ev b { display: block; font-size: 12.5px; }
.ev.food { background: #FFEDE3; color: #7C2D12; border: 1px solid #FBD3BE; }
.ev.open { background: repeating-linear-gradient(135deg, var(--paper-2) 0 6px, #fff 6px 12px); color: var(--ink-3); border: 1px dashed var(--paper-line); }
.export { display: flex; flex-wrap: wrap; gap: 6px; }
.export span { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 9999px; background: var(--paper-2); color: var(--ink-2); }

/* ---------- 3. Hoà phiếu: bản đồ thật + điểm của bạn ---------- */
.tie-sec { background: var(--night-2); border-block: 1px solid var(--night-line); }
.tie-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: end; }
.cast { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.cast span { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--moon-2); background: var(--night-3); border-radius: 9999px; padding: 4px 14px 4px 4px; }
.cast img { width: 28px; height: 28px; }
.explore { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; margin-top: 48px; align-items: stretch; }
.map-card { position: relative; border-radius: 18px; overflow: hidden; background: #F3EFE6; min-height: 560px; box-shadow: 0 40px 80px -24px rgb(0 0 0 / 0.6); }
.map-card .ml { position: absolute; inset: 0; }
.map-card .ask { position: absolute; z-index: 2; left: 14px; right: 14px; top: 14px; background: #fff; color: var(--ink); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 24px -12px rgb(28 25 23 / 0.45); }
.ask-q { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.ask-q img { width: 26px; height: 26px; }
.chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 36px; padding: 0 13px; border-radius: 9999px; border: 1px solid var(--paper-line); background: var(--paper-2); color: var(--ink-2); font: 600 12.5px/1 var(--body); cursor: pointer; transition: background-color var(--t-ui) var(--ease-out), color var(--t-ui) var(--ease-out), border-color var(--t-ui) var(--ease-out); }
.chips button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); border-color: rgb(199 62 38 / 0.3); }
@media (hover: hover) { .chips button:hover { border-color: var(--ink-3); color: var(--ink); } }
.ask-hint { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
.privacy-note { position: absolute; z-index: 2; left: 14px; bottom: 14px; max-width: calc(100% - 28px); background: rgb(28 25 23 / 0.88); color: var(--paper); border-radius: 12px; padding: 8px 12px; font-size: 12px; display: flex; gap: 6px; align-items: flex-start; }
.privacy-note svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.fpin { display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: none; }
.fpin img { width: 34px; height: 34px; box-shadow: 0 0 0 3px #fff, 0 6px 14px -4px rgb(28 25 23 / 0.5); }
.fpin span { font: 600 11px/1 var(--body); color: var(--ink); background: rgb(255 255 255 / 0.92); border-radius: 9999px; padding: 3px 7px; white-space: nowrap; }
.you { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: grab; touch-action: none; }
.you:active { cursor: grabbing; }
.you img { width: 44px; height: 44px; box-shadow: 0 0 0 3px var(--coral), 0 0 0 6px #fff, 0 10px 20px -6px rgb(28 25 23 / 0.55); }
.you span { font: 700 11.5px/1 var(--body); color: var(--ink); background: var(--coral); border-radius: 9999px; padding: 4px 8px; white-space: nowrap; }
.you.drop { animation: drop 520ms var(--ease-out); }
@keyframes drop { 0% { transform: translateY(-28px); opacity: 0; } 70% { transform: translateY(3px); opacity: 1; } 100% { transform: none; } }
.mlab { font: 700 11px/1 var(--body); padding: 4px 7px; border-radius: 9999px; background: #fff; color: var(--ink-2); box-shadow: 0 2px 8px -3px rgb(28 25 23 / 0.4); white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.mlab.sel { background: var(--coral); color: var(--ink); }

.side { display: flex; flex-direction: column; gap: 16px; }
.seg { position: relative; display: inline-flex; padding: 5px; border-radius: 9999px; background: var(--night); border: 1px solid var(--night-line); max-width: 100%; align-self: flex-start; }
.seg .knob { position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 9999px; background: var(--moon); transition: transform var(--t-sheet) var(--ease-out), width var(--t-sheet) var(--ease-out); }
.seg button { position: relative; z-index: 1; min-height: 46px; padding: 0 18px; border: 0; border-radius: 9999px; background: transparent; color: var(--moon-2); font: 600 14.5px/1.2 var(--body); cursor: pointer; white-space: nowrap; transition: color var(--t-ui) var(--ease-out); }
.seg button[aria-pressed="true"] { color: var(--night); }
.verdict { min-height: 7.5em; }
.verdict .pick { font: 800 clamp(24px, 2.4vw, 30px)/1.2 var(--display); letter-spacing: -0.02em; }
.verdict .why-line { margin-top: 10px; font-size: 16px; color: var(--moon-2); }
.verdict .why-line b { color: var(--lamp); font-weight: 700; }
.board { background: var(--paper); color: var(--ink); border-radius: 18px; padding: 20px; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.board-head h3 { font: 700 15px/1.3 var(--body); }
.board-head span { font-size: 12px; color: var(--ink-3); }
.rows { position: relative; margin-top: 10px; display: flex; flex-direction: column; }
.sel-frame { position: absolute; left: -8px; right: -8px; top: 0; border-radius: 12px; background: var(--accent-soft); transition: transform var(--t-sheet) var(--ease-out), height var(--t-sheet) var(--ease-out); z-index: 0; }
.row { position: relative; z-index: 1; display: grid; gap: 6px; padding-block: 9px; }
.row-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.row-name { font-weight: 600; font-size: 14px; color: var(--ink-2); transition: color var(--t-ui) var(--ease-out); min-width: 0; }
.row.sel .row-name { color: var(--ink); }
.row-km { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.track { position: relative; height: 30px; border-radius: 8px; background: var(--paper-2); overflow: hidden; }
.row.sel .track { background: #fff; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: #D6D3D1; transition: width 520ms var(--ease-out), background-color var(--t-ui) var(--ease-out); }
.row.sel .fill { background: var(--coral); }
.who { position: absolute; top: 3px; height: 24px; display: flex; align-items: center; gap: 5px; font: 700 12.5px/1 var(--body); color: var(--ink); transition: left 520ms var(--ease-out); white-space: nowrap; }
.who img { width: 22px; height: 22px; box-shadow: 0 0 0 2px #fff; }
.who.isyou img { box-shadow: 0 0 0 2px var(--coral); }
.board-note { margin-top: 10px; font-size: 12px; color: var(--ink-3); }

/* ---------- 4. Số đo ---------- */
.lamp-sec { background: var(--lamp); color: var(--lamp-ink); }
.lamp-sec .sub { color: var(--lamp-ink-2); }
.lamp-sec ::selection { background: var(--lamp-ink); color: var(--lamp); }
.lamp-sec :focus-visible { outline-color: var(--lamp-ink); }
.charts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; margin-top: 64px; }
.chart h3 { margin-top: 14px; font: 700 18px/1.35 var(--body); }
.chart .note { margin-top: 4px; font-size: 14px; color: var(--lamp-ink-2); }
.big { font: 800 clamp(56px, 8vw, 112px)/1.05 var(--display); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.bars { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
.bar-r { display: grid; grid-template-columns: 11em minmax(0, 1fr); gap: 12px; align-items: center; }
.bar-r .lab { font-size: 14px; font-weight: 500; }
.bar-r .tr { position: relative; height: 34px; }
.bar-r .tr i { position: absolute; inset: 0 auto 0 0; min-width: 3px; background: rgb(42 26 12 / 0.22); border-radius: 6px; transform-origin: left; transition: transform 1000ms var(--ease-out); transition-delay: calc(var(--i, 0) * 90ms); }
.bar-r .tr em { position: absolute; top: 50%; transform: translateY(-50%); font: 700 14px/1 var(--body); font-style: normal; font-variant-numeric: tabular-nums; white-space: nowrap; transition: opacity 400ms var(--ease-out); transition-delay: calc(var(--i, 0) * 90ms + 600ms); }
.charts.pre .bar-r .tr i { transform: scaleX(0); }
.charts.pre .bar-r .tr em { opacity: 0; }
.bar-r.us .lab { font-weight: 700; }
.bar-r.us .tr i { background: var(--lamp-ink); }
.table-toggle { margin-top: 56px; }
.table-toggle summary { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 9999px; border: 1px solid rgb(42 26 12 / 0.35); font-weight: 600; cursor: pointer; list-style: none; transition: background-color var(--t-ui) var(--ease-out); }
@media (hover: hover) { .table-toggle summary:hover { background: rgb(42 26 12 / 0.07); } }
.table-toggle summary::-webkit-details-marker { display: none; }
.table-toggle summary svg { transition: transform var(--t-ui) var(--ease-out); }
.table-toggle[open] summary svg { transform: rotate(180deg); }
.table-toggle[open] .tbl-wrap { animation: rise 420ms var(--ease-out); }
.tbl-wrap { overflow-x: auto; margin-top: 20px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14.5px; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid rgb(42 26 12 / 0.18); }
th { font-weight: 600; color: var(--lamp-ink-2); font-size: 13px; }
td.c { text-align: center; }
tr.us td { font-weight: 700; background: rgb(42 26 12 / 0.07); }
.src { margin-top: 14px; font-size: 13px; color: var(--lamp-ink-2); }

/* ---------- 5. Kết + QR ---------- */
.end { padding-block: 144px 112px; }
.end-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 48px; align-items: center; }
.end h2 { font: 800 clamp(44px, 7vw, 96px)/1.2 var(--display); letter-spacing: -0.03em; max-width: 12em; }
.end .sub { margin-top: 18px; font-size: 18px; color: var(--moon-2); }
.end .cast { margin-top: 28px; }
.qr { background: var(--paper); color: var(--ink); border-radius: 20px; padding: 18px; width: 236px; text-align: center; box-shadow: 0 30px 60px -24px rgb(0 0 0 / 0.6); }
.qr #qrcode { width: 200px; height: 200px; margin: 0 auto; }
.qr #qrcode img, .qr #qrcode canvas { width: 200px !important; height: 200px !important; image-rendering: pixelated; }
.qr p { margin-top: 12px; font-weight: 700; font-size: 14px; }
.qr small { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); word-break: break-all; }
footer { border-top: 1px solid var(--night-line); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-block: 24px; font-size: 13px; color: var(--moon-3); }
.mock-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; transform: translate(-50%, 16px); opacity: 0; background: var(--moon); color: var(--night); border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 500; box-shadow: 0 16px 32px -12px rgb(0 0 0 / 0.6); transition: opacity var(--t-ui) var(--ease-out), transform var(--t-ui) var(--ease-out); pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.mock-toast.show { opacity: 1; transform: translate(-50%, 0); }
.maplibregl-ctrl-attrib { font-size: 10px; }

/* ---------- Đáp ứng ---------- */
@media (max-width: 1080px) { .app-body { grid-template-columns: 240px minmax(0, 1fr); } }
@media (max-width: 960px) {
  .hero { padding-top: 104px; }
  .hero-grid, .chat-grid, .flow, .charts, .explore, .end-grid, .tie-top { grid-template-columns: minmax(0, 1fr); gap: 40px; }
  .hero .app { max-width: 440px; }
  .app-body { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .app-body .map { display: none; }
  .panel { border-right: 0; }
  .street { height: 190px; margin-top: 0; }
  .sec { padding-block: 96px; }
  .chat { justify-self: start; }
  .flow { margin-top: 40px; }
  .flow-device { display: none; }
  .fstep, .fstep:first-child { min-height: 0; padding-block: 28px; }
  .fstep .fstep-n { color: var(--lamp); } .fstep .fstep-n::after { background: var(--lamp); }
  .fstep h3 { color: var(--moon); } .fstep p { color: var(--moon-2); }
  .fstep .inline { display: block; margin-top: 22px; max-width: 440px; min-height: 200px; }
  .map-card { min-height: 460px; }
  .qr { display: none; }
  .end { padding-block: 104px 88px; }
}
@media (max-width: 480px) {
  .hero .lede { font-size: 17px; }
  .cta-row .btn { flex: 1 1 auto; }
  .seg { display: flex; width: 100%; }
  .seg button { flex: 1 1 auto; padding: 0 10px; font-size: 13.5px; white-space: normal; }
  .board { padding: 16px; }
  .bar-r { grid-template-columns: 8em minmax(0, 1fr); }
  .code { display: none; }
  .top-create { display: none; }
  .top-actions { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; }
  .btn:active, .chot:active { transform: none; }
  .fill, .who, .bar-r .tr i, .mini .t i, .photo img { transition: none !important; }
  .sel-frame, .seg .knob, .lang .knob, .top-create { transition-duration: 1ms !important; }
  .chat .seq { transform: none !important; }
}
</style>

<header class="top" id="top">
  <div class="wrap">
    <a class="wordmark" href="#" aria-label="Hangoutplanner"><b aria-hidden="true">Hangout</b><i aria-hidden="true">PLANNER</i></a>
    <div class="top-actions">
      <button class="btn btn-primary btn-sm top-create" type="button" data-mock="create" data-i="create" tabindex="-1">Tạo phòng</button>
      <button class="btn btn-ghost btn-sm" type="button" data-mock="join" data-i="join">Nhập mã</button>
      <button class="icon-btn" type="button" id="sound" aria-pressed="false" data-i-label="soundOn" aria-label="Bật âm thanh"><svg aria-hidden="true"><use href="#i-sound-off"/></svg></button>
      <div class="lang" role="group" aria-label="Ngôn ngữ / Language" id="lang" data-lang="vi">
        <span class="knob" aria-hidden="true"></span>
        <button type="button" aria-pressed="true" data-set-lang="vi">VI</button>
        <button type="button" aria-pressed="false" data-set-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- ===== 0. Hero: phòng mẫu + phố đêm + bốn bạn hội tụ ===== -->
  <section class="hero intro" aria-labelledby="hero-title">
    <div class="wrap hero-grid">
      <div>
        <h1 id="hero-title"><span class="ln" data-i="h1a">Tối nay đi đâu?</span> <span class="ln hl" data-i="h1b">Chốt trong một phòng.</span></h1>
        <p class="lede" data-ih="lede"></p>
        <div class="cta-row" id="hero-cta">
          <button class="btn btn-primary" type="button" data-mock="create" data-i="create">Tạo phòng</button>
          <button class="btn btn-ghost" type="button" data-mock="join" data-i="join">Nhập mã</button>
        </div>
        <p class="resume"><span data-i="resume"></span> <a href="#" data-mock="resume"><span data-i="resumeLink"></span> NN64S8</a></p>
        <p class="try"><svg aria-hidden="true"><use href="#i-hand"/></svg><span data-i="try"></span></p>
      </div>
      <div class="app" id="room">
        <div class="app-bar">
          <span class="mark" aria-hidden="true">H</span>
          <span class="app-title" data-i="roomTitle"></span>
          <span class="code num">NN64S8</span>
          <span class="presence" id="presence" role="img"></span>
        </div>
        <div class="app-body">
          <div class="panel">
            <div id="room-card" aria-live="polite"></div>
            <div id="room-places"></div>
          </div>
          <div class="map" aria-hidden="true">
            <div class="ml" id="hero-map"></div>
            <div class="map-chip"><svg width="13" height="13"><use href="#i-pin"/></svg><span data-i="center"></span></div>
            <div class="toast" id="room-toast"><span id="toast-av"></span><span id="room-toast-text"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="street" id="street" aria-hidden="true">
      <svg class="scene" id="scene" preserveAspectRatio="xMidYMax slice" viewBox="0 0 1440 230"></svg>
      <div class="riders" id="riders"></div>
    </div>
  </section>

  <!-- ===== 1. Nhóm chat rối ===== -->
  <section class="sec" aria-labelledby="chat-title">
    <div class="wrap chat-grid">
      <div class="sec-head">
        <h2 id="chat-title" data-i="chatH"></h2>
        <p class="sub" data-i="chatSub"></p>
      </div>
      <div class="chat" id="chat" role="img" data-i-label="chatLabel"></div>
    </div>
  </section>

  <!-- ===== Dải ảnh thật ===== -->
  <section class="photo" id="photo" aria-label="">
    <img src="assets/bui-vien-night.webp" alt="" data-i-alt="photoAlt" loading="lazy" decoding="async">
    <div class="cap"><div class="wrap"><p data-i="photoCap"></p></div></div>
    <a class="credit" href="https://commons.wikimedia.org/wiki/File:Bui_Vien_Street,_Ho_Chi_Minh_City,_at_night,_2023_(13).jpg" target="_blank" rel="noopener" data-i="credit"></a>
  </section>

  <!-- ===== 2. Một phòng, bốn bước ===== -->
  <section class="sec" aria-labelledby="flow-title">
    <div class="wrap">
      <div class="sec-head">
        <h2 id="flow-title" data-i="flowH"></h2>
        <p class="sub" data-i="flowSub"></p>
      </div>
      <div class="flow">
        <div class="flow-steps">
          <article class="fstep on" data-step="0"><span class="fstep-n num">1</span><h3 data-i="s1h"></h3><p data-i="s1p"></p></article>
          <article class="fstep" data-step="1"><span class="fstep-n num">2</span><h3 data-i="s2h"></h3><p data-i="s2p"></p></article>
          <article class="fstep" data-step="2"><span class="fstep-n num">3</span><h3 data-i="s3h"></h3><p data-i="s3p"></p></article>
          <article class="fstep" data-step="3"><span class="fstep-n num">4</span><h3 data-i="s4h"></h3><p data-i="s4p"></p></article>
        </div>
        <div class="flow-device">
          <div class="app">
            <div class="app-bar"><span class="mark" aria-hidden="true">H</span><span class="app-title" data-i="roomTitle"></span><span class="steps" id="device-steps" role="group" data-i-label="stepsLabel"></span></div>
            <div id="device-screen" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 3. Hoà phiếu: bạn là người thứ năm ===== -->
  <section class="sec tie-sec" aria-labelledby="tie-title">
    <div class="wrap">
      <div class="sec-head">
        <h2 id="tie-title" data-i="tieH"></h2>
        <p class="sub" data-i="tieSub"></p>
        <div class="cast" id="cast-tie"></div>
      </div>
      <div class="explore">
        <div class="map-card">
          <div class="ml" id="tie-map"></div>
          <div class="ask">
            <p class="ask-q"><span id="ask-av"></span><span data-i="askQ"></span></p>
            <div class="chips" id="chips" role="group" data-i-label="askQ"></div>
            <p class="ask-hint" data-i="askHint"></p>
          </div>
          <p class="privacy-note"><svg aria-hidden="true"><use href="#i-lock"/></svg><span data-i="privacy"></span></p>
        </div>
        <div class="side">
          <div class="seg" role="group" data-i-label="segLabel" id="seg" data-mode="far">
            <span class="knob" aria-hidden="true"></span>
            <button type="button" data-mode="sum" aria-pressed="false" data-i="modeSum"></button>
            <button type="button" data-mode="far" aria-pressed="true" data-i="modeFar"></button>
          </div>
          <div class="verdict" aria-live="polite" id="verdict"></div>
          <div class="board">
            <div class="board-head"><h3 data-i="boardH"></h3><span data-i="boardUnit"></span></div>
            <div class="rows" id="rows"><span class="sel-frame" id="sel-frame" aria-hidden="true"></span></div>
            <p class="board-note" id="board-note"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 4. Số đo ===== -->
  <section class="sec lamp-sec" aria-labelledby="num-title">
    <div class="wrap">
      <div class="sec-head">
        <h2 id="num-title" data-i="numH"></h2>
        <p class="sub" data-i="numSub"></p>
      </div>
      <div class="charts" id="charts">
        <div class="chart">
          <p class="big"><span class="count" data-to="1.13" data-dec="2" data-prefix="+"></span>%</p>
          <h3 data-i="c1h"></h3><p class="note" data-i="c1n"></p>
          <div class="bars" id="chart-sum"></div>
        </div>
        <div class="chart">
          <p class="big"><span class="count" data-to="9.37" data-dec="2"></span>%</p>
          <h3 data-i="c2h"></h3><p class="note" data-i="c2n"></p>
          <div class="bars" id="chart-far"></div>
        </div>
      </div>
      <details class="table-toggle">
        <summary><span data-i="tblBtn"></span> <svg width="16" height="16" aria-hidden="true"><use href="#i-caret"/></svg></summary>
        <div class="tbl-wrap"><table>
          <thead><tr><th data-i="th1"></th><th data-i="th2"></th><th data-i="th3"></th><th data-i="th4"></th><th data-i="th5"></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
        <p class="src" data-i="src"></p>
      </details>
    </div>
  </section>

  <!-- ===== 5. Kết + QR ===== -->
  <section class="end" aria-labelledby="end-title">
    <div class="wrap end-grid">
      <div>
        <h2 id="end-title" data-i="endH"></h2>
        <p class="sub" data-i="endSub"></p>
        <div class="cta-row" id="end-cta">
          <button class="btn btn-primary" type="button" data-mock="create" data-i="create"></button>
          <button class="btn btn-ghost" type="button" data-mock="join" data-i="join"></button>
        </div>
        <div class="cast" id="cast-end"></div>
      </div>
      <div class="qr">
        <div id="qrcode" role="img" data-i-label="qrLabel"></div>
        <p data-i="qrTitle"></p>
        <small>didau-omega.vercel.app</small>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-i="foot"></span>
    <span data-i="mapCredit"></span>
  </div>
</footer>
<div class="mock-toast" id="mock-toast" role="status"></div>

    return PLACES.map(function (p) {
      var y = you ? trip(you, p) : null;
      var far = p.far, who = p.farWho;
      if (y && y.min > far) { far = y.min; who = 'you'; }
      return { p: p, y: y, far: far, who: who, total: p.km + (y ? y.km : 0) };
    });
  }
  function pickOf(ev, m) {
    var s = ev.slice().sort(m === 'sum' ? function (a, b) { return a.total - b.total; } : function (a, b) { return a.far - b.far || a.total - b.total; });
    return s[0];
  }
  var whoName = function (w) { return w === 'you' ? t('you') : w; };
  function renderBoard(animate) {
    var ev = evaluate(), pick = pickOf(ev, mode), other = pickOf(ev, mode === 'far' ? 'sum' : 'far');
    if (!rowsEl.querySelector('.row')) {
      PLACES.forEach(function (p) {
        var d = document.createElement('div'); d.className = 'row'; d.dataset.id = p.id;
        d.innerHTML = '<div class="row-top"><span class="row-name">' + p.name + '</span><span class="row-km num"></span></div><div class="track"><div class="fill"></div><span class="who"></span></div>';
        rowsEl.appendChild(d);
      });
    }
    var MAXM = Math.max(110, Math.max.apply(null, ev.map(function (e) { return e.far; })) + 10);
    ev.forEach(function (e) {
      var r = rowsEl.querySelector('.row[data-id="' + e.p.id + '"]');
      r.classList.toggle('sel', e.p.id === pick.p.id);
      r.querySelector('.row-km').textContent = fill(t('total'), { k: dec(Math.round(e.total * 10) / 10) });
      var w = e.far / MAXM * 100;
      r.querySelector('.fill').style.width = w + '%';
      var wh = r.querySelector('.who');
      wh.className = 'who' + (e.who === 'you' ? ' isyou' : '');
      wh.style.left = 'calc(' + w + '% - ' + (e.who === 'you' ? 5.6 : 6.4) + 'em)';
      wh.innerHTML = avImg(e.who === 'you' ? 'Bạn' : e.who) + '<span class="num">' + e.far + '′</span>';
    });
    var sel = rowsEl.querySelector('.row.sel'); frame.style.height = sel.offsetHeight + 'px'; frame.style.transform = 'translateY(' + sel.offsetTop + 'px)';
    // lời kết luận
    var html;
    if (!you && mode === 'far') html = '<p class="pick">' + t('vWaitPick') + '</p><p class="why-line">' + t('vWaitWhy') + '</p>';
    else if (mode === 'far') {
      var yMin = pick.y ? pick.y.min : 0;
      html = '<p class="pick">' + fill(t('vFarPick'), { n: pick.p.name }) + '</p><p class="why-line">' + (pick.who === 'you' ? fill(t('vFarYou'), { m: pick.far }) : fill(t('vFarOther'), { w: whoName(pick.who), m: pick.far, y: yMin })) +
        (other.p.id !== pick.p.id ? ' ' + fill(t('vDiff'), { n: other.p.name, w: whoName(other.who), m: other.far }) : '') + '</p>';
    } else {
      html = '<p class="pick">' + fill(t('vSumPick'), { n: pick.p.name }) + '</p><p class="why-line">' + fill(t('vSumWhy'), { k: dec(Math.round(pick.total * 10) / 10), w: whoName(pick.who), m: pick.far }) + '</p>';
    }
    if (verdict.dataset.key !== pick.p.id + mode + (you ? 1 : 0)) { verdict.innerHTML = html.replace(/class="pick"/, 'class="pick' + (animate ? ' swap' : '') + '"'); verdict.dataset.key = pick.p.id + mode + (you ? 1 : 0); }
    else verdict.innerHTML = html;
    document.getElementById('board-note').textContent = you ? t('noteEst') : '';
    syncTieMap(ev, pick);
  }
  function moveKnob() { var b = seg.querySelector('[data-mode="' + mode + '"]'), k = seg.querySelector('.knob'); k.style.width = b.offsetWidth + 'px'; k.style.transform = 'translateX(' + b.offsetLeft + 'px)'; }
  function setMode(m) { if (m === mode) return; mode = m; seg.dataset.mode = m; seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); }); moveKnob(); renderBoard(true); }
  seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
  seg.addEventListener('keydown', function (e) { if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; e.preventDefault(); var m = e.key === 'ArrowLeft' ? 'sum' : 'far'; setMode(m); seg.querySelector('[data-mode="' + m + '"]').focus(); });

  // Bản đồ lớn: vùng mờ cấp quận cho 4 bạn, ghim 3 quán, điểm của bạn kéo được + 3 đường thẳng tới quán
  var tm = null, tiePins = {}, youMarker = null, midLabels = {};
  function initTieMap() {
    if (!hasML || tm) return;
    tm = new maplibregl.Map({ container: 'tie-map', style: STYLE, center: [106.712, 10.79], zoom: 11.3, attributionControl: { compact: true }, cooperativeGestures: false, dragRotate: false, pitchWithRotate: false, fadeDuration: 0 });
    tm.scrollZoom.disable();
    tm.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
    tm.on('load', function () {
      tidyStyle(tm);
      tm.fitBounds([[106.69, 10.715], [106.765, 10.86]], { padding: { top: 150, bottom: 70, left: 40, right: 40 }, duration: 0 });
      tm.addSource('areas', { type: 'geojson', data: { type: 'FeatureCollection', features: CAST.map(function (c) { return { type: 'Feature', properties: { color: c.color }, geometry: { type: 'Point', coordinates: HOME[c.area] } }; }) } });
      tm.addLayer({ id: 'areas', type: 'circle', source: 'areas', paint: { 'circle-color': ['get', 'color'], 'circle-opacity': 0.42, 'circle-blur': 0.6, 'circle-radius': ['interpolate', ['exponential', 2], ['zoom'], 10, 26, 12, 90, 14, 330] } });
      tm.addSource('legs', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      tm.addLayer({ id: 'legs', type: 'line', source: 'legs', layout: { 'line-cap': 'round' }, paint: { 'line-color': ['case', ['get', 'sel'], '#FF6B4A', '#78716C'], 'line-width': ['case', ['get', 'sel'], 4, 2], 'line-dasharray': [2, 2], 'line-opacity': ['case', ['get', 'sel'], 1, 0.7] } });
      CAST.forEach(function (c) {
        var el = document.createElement('div'); el.className = 'fpin';
        el.innerHTML = avImg(c.id) + '<span>' + c.id + ' · ' + t('riderArea')[c.area] + '</span>';
        new maplibregl.Marker({ element: el }).setLngLat(HOME[c.area]).addTo(tm);
      });
      PLACES.forEach(function (p) { var el = pinEl(p); tiePins[p.id] = el; new maplibregl.Marker({ element: el }).setLngLat(p.ll).addTo(tm); });
      PLACES.forEach(function (p) { var el = document.createElement('div'); el.className = 'mlab'; midLabels[p.id] = { el: el, m: new maplibregl.Marker({ element: el }) }; });
      tm.on('click', function (e) { setYou([e.lngLat.lng, e.lngLat.lat], null, true); });
      renderBoard(false);
    });
  }
  function syncTieMap(ev, pick) {
    if (!tm || !tm.getSource('legs')) return;
    PLACES.forEach(function (p) { var el = tiePins[p.id]; if (el) el.classList.toggle('sel', p.id === pick.p.id); });
    tm.getSource('legs').setData({ type: 'FeatureCollection', features: you ? PLACES.map(function (p) { return { type: 'Feature', properties: { sel: p.id === pick.p.id }, geometry: { type: 'LineString', coordinates: [you, p.ll] } }; }) : [] });
    ev.forEach(function (e) {
      var ml = midLabels[e.p.id]; if (!ml) return;
      if (!you) { ml.m.remove(); return; }
      ml.el.classList.toggle('sel', e.p.id === pick.p.id);
      ml.el.textContent = e.y.min + '′';
      ml.m.setLngLat([(you[0] + e.p.ll[0]) / 2, (you[1] + e.p.ll[1]) / 2]).addTo(tm);
    });
  }
  var raf = 0;
  function setYou(ll, area, drop) {
    you = ll; youArea = area;
    document.querySelectorAll('#chips button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.area === area)); });
    if (tm) {
      if (!youMarker) {
        var el = document.createElement('div'); el.className = 'you';
        el.innerHTML = avImg('Bạn') + '<span>' + t('you') + '</span>';
        youMarker = new maplibregl.Marker({ element: el, draggable: true }).setLngLat(ll).addTo(tm);
        youMarker.on('drag', function () { var p = youMarker.getLngLat(); you = [p.lng, p.lat]; youArea = null; if (!raf) raf = requestAnimationFrame(function () { raf = 0; document.querySelectorAll('#chips button').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); renderBoard(false); }); });
        youMarker.on('dragend', function () { renderBoard(true); play('tick'); });
      } else youMarker.setLngLat(ll);
      if (drop && !RM) { var y = youMarker.getElement(); y.classList.remove('drop'); void y.offsetWidth; y.classList.add('drop'); }
    }
    renderBoard(true); play('tick');
  }
  function renderChips() {
    var D = t('districts');
    document.getElementById('chips').innerHTML = Object.keys(DIST).map(function (k) { return '<button type="button" data-area="' + k + '" aria-pressed="' + (youArea === k) + '">' + D[k] + '</button>'; }).join('');
  }
  document.getElementById('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-area]'); if (b) setYou(DIST[b.dataset.area], b.dataset.area, true); });
  document.getElementById('ask-av').innerHTML = avImg('Bạn');
  function renderCast(id) { document.getElementById(id).innerHTML = CAST.map(function (c) { return '<span>' + avImg(c.id) + c.id + ' · ' + t('riderArea')[c.area] + '</span>'; }).join(''); }
  renderChips(); renderCast('cast-tie'); renderCast('cast-end');
  var tieSec = document.querySelector('.tie-sec');
  once(tieSec, initTieMap, { rootMargin: '600px 0px' });
  renderBoard(false);
  window.addEventListener('resize', function () { moveKnob(); var sel = rowsEl.querySelector('.row.sel'); if (sel) { frame.style.height = sel.offsetHeight + 'px'; frame.style.transform = 'translateY(' + sel.offsetTop + 'px)'; } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { moveKnob(); placeRiders(false); renderBoard(false); });
  moveKnob();

  /* ================= 4. Số đo ================= */
  var charts = document.getElementById('charts');
  function bars(id, data, max) { document.getElementById(id).innerHTML = data.map(function (d, i) { var w = d.v / max * 100, inside = w > 55; return '<div class="bar-r' + (d.us ? ' us' : '') + '" style="--i:' + i + '"><span class="lab">' + d.label + '</span><span class="tr"><i style="width:' + w + '%"></i><em style="' + (inside ? 'right:' + (100 - w) + '%;margin-right:10px' : 'left:calc(' + w + '% + 10px)') + '">' + dec(d.v) + '%</em></span></div>'; }).join(''); }
  function renderNumbers() {
    var A = t('algos');
    bars('chart-sum', [{ label: A.greedy, v: 44.7 }, { label: A.weighted, v: 20.1 }, { label: A.life, v: 13.9 }, { label: 'Hangoutplanner', v: 1.13, us: true }], 50);
    bars('chart-far', [{ label: A.sum, v: 35.7 }, { label: 'Hangoutplanner', v: 9.37, us: true }], 50);
    charts.querySelectorAll('.count').forEach(function (el) { el.textContent = (el.dataset.prefix || '') + dec(+el.dataset.to, +el.dataset.dec); });
  }
  function renderTable() {
    var A = t('algos'), R = t('r'), y = t('yes'), n = t('no'), pt = t('part');
    document.getElementById('tbody').innerHTML = [['random', n, n, n], ['greedy', y, n, pt], ['weighted', y, n, pt], ['life', y, pt, pt], ['sum', y, y, n], ['us', y, y, y]].map(function (r) { return '<tr' + (r[0] === 'us' ? ' class="us"' : '') + '><td>' + A[r[0]] + '</td><td class="c">' + r[1] + '</td><td class="c">' + r[2] + '</td><td class="c">' + r[3] + '</td><td class="num">' + R[r[0]] + '</td></tr>'; }).join('');
  }
  renderNumbers(); renderTable();
  if (HAS_IO && below(charts)) {
    charts.classList.add('pre');
    charts.querySelectorAll('.count').forEach(function (el) { el.textContent = (el.dataset.prefix || '') + dec(0, +el.dataset.dec); });
    once(charts, function () { charts.classList.remove('pre'); charts.querySelectorAll('.count').forEach(function (el) { var to = +el.dataset.to, d = +el.dataset.dec, pre = el.dataset.prefix || ''; tween(0, to, 1000, function (v) { el.textContent = pre + dec(v, d); }); }); }, { threshold: 0.25 });
  }

  /* ================= 5. QR ================= */
  if (typeof QRCode !== 'undefined') new QRCode(document.getElementById('qrcode'), { text: 'https://didau-omega.vercel.app/', width: 400, height: 400, colorDark: '#1C1917', colorLight: '#FAFAF9', correctLevel: QRCode.CorrectLevel.M });

  /* ================= Đổi ngôn ngữ ================= */
  function setLang(l) {
    lang = l; try { localStorage.setItem('hp-landing-lang', l); } catch (e) {}
    applyStatic(); room.kind = ''; renderRoom(); renderPresence(); renderRiders(); ridersEl.classList.add('arrived');
    renderChat(); renderFlow(current, 0, true);
    fsteps.forEach(function (s, k) { var box = s.querySelector('.inline'); if (box && box.dataset.ready) fillInline(box, k, true); });
    renderChips(); renderCast('cast-tie'); renderCast('cast-end');
    if (youMarker) youMarker.getElement().querySelector('span').textContent = t('you');
    moveKnob(); renderBoard(false); renderNumbers(); renderTable();
  }
  document.querySelectorAll('[data-set-lang]').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.setLang); }); });
  applyStatic();
  if (lang !== 'vi') setLang(lang);
  syncTop();
})();
</script>
</body>
